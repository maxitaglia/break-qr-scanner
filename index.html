
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BREAK | Control de pasajeros</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 22px;
      background: #f1f3f5;
      color: #20252b;
      font-family: Arial, sans-serif;
    }
    .contenedor {
      max-width: 440px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 16px #00000012;
    }
    h1 { text-align: center; margin: 0 0 6px; }
    .subtitulo {
      text-align: center;
      color: #68717b;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }
    input, select, button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
    }
    input, select {
      border: 1px solid #ccd2d8;
      background: white;
    }
    button {
      border: 0;
      background: #171c22;
      color: white;
      font-weight: bold;
      margin-top: 18px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .secundario {
      background: #e7eaee;
      color: #20252b;
    }
    #lector {
      width: 100%;
      margin-top: 18px;
    }
    #estado {
      margin-top: 18px;
      padding: 14px;
      border-radius: 9px;
      background: #f0f2f4;
      white-space: pre-wrap;
      line-height: 1.45;
      text-align: center;
    }
    .oculto { display: none; }
    .nombre-coordinador {
      text-align: center;
      color: #59636e;
      margin: 12px 0;
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <h1>BREAK</h1>
    <div class="subtitulo">Control de excursiones</div>

    <section id="login">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" placeholder="tu correo">

      <label for="codigo">Código de acceso</label>
      <input id="codigo" type="password"
             inputmode="numeric" maxlength="6"
             placeholder="6 dígitos">

      <button id="btnLogin" onclick="iniciarSesion()">
        Ingresar
      </button>
    </section>

    <section id="panel" class="oculto">
      <div id="coordinador" class="nombre-coordinador"></div>

      <label for="etapa">Tipo de control</label>
      <select id="etapa">
        <option value="IDA">IDA</option>
        <option value="REGRESO">REGRESO</option>
      </select>

      <div id="lector"></div>

      <button id="btnCamara" onclick="iniciarCamara()">
        Activar cámara
      </button>

      <button id="btnSiguiente" class="secundario oculto"
              onclick="iniciarCamara()">
        Escanear siguiente pasajero
      </button>

      <button class="secundario" onclick="cerrarSesion()">
        Cerrar sesión
      </button>
    </section>

    <div id="estado">Ingresá con tus datos de coordinador.</div>
  </main>

<script>
  const API_URL =
    "https://break-qr-api.maxpietra306.workers.dev";

  let sesion = "";
  let nombreCoordinador = "";
  let escaner = null;
  let procesando = false;
  let camaraActiva = false;

  function mostrarEstado(mensaje) {
    document.getElementById("estado").textContent = mensaje;
  }

  async function llamarAPI(datos) {
    const respuesta = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(datos)
    });

    const resultado = await respuesta.json();

    if (!resultado.ok) {
      throw new Error(resultado.error || "Error de conexión.");
    }

    return resultado.resultado;
  }

  async function iniciarSesion() {
    const email = document.getElementById("email").value.trim();
    const codigo = document.getElementById("codigo").value.trim();
    const boton = document.getElementById("btnLogin");

    if (!email || !/^\d{6}$/.test(codigo)) {
      mostrarEstado("Ingresá un correo y un código de 6 dígitos.");
      return;
    }

    boton.disabled = true;
    mostrarEstado("Verificando acceso...");

    try {
      const resultado = await llamarAPI({
        action: "login",
        email: email,
        codigo: codigo
      });

      sesion = resultado.token;
      nombreCoordinador = resultado.nombre;

      document.getElementById("login").classList.add("oculto");
      document.getElementById("panel").classList.remove("oculto");
      document.getElementById("coordinador").textContent =
        "Coordinador: " + nombreCoordinador;

      mostrarEstado("Sesión iniciada. Elegí IDA o REGRESO y activá la cámara.");

    } catch (error) {
      mostrarEstado(error.message);
    } finally {
      boton.disabled = false;
    }
  }

  async function iniciarCamara() {
    if (!sesion || camaraActiva) return;

    if (!window.isSecureContext ||
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      mostrarEstado("La cámara requiere una conexión HTTPS.");
      return;
    }

    procesando = false;
    document.getElementById("btnCamara").classList.add("oculto");
    document.getElementById("btnSiguiente").classList.add("oculto");

    try {
      if (!escaner) {
        escaner = new Html5Qrcode("lector");
      }

      mostrarEstado("Solicitando acceso a la cámara...");

      await escaner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 }
        },
        codigo => procesarQR(codigo),
        () => {}
      );

      camaraActiva = true;
      mostrarEstado("Cámara activa. Enfocá el QR del pasajero.");

    } catch (error) {
      camaraActiva = false;
      document.getElementById("btnCamara").classList.remove("oculto");
      mostrarEstado("No se pudo activar la cámara.\n" +
        (error.message || error));
    }
  }

  async function procesarQR(codigoQR) {
    if (procesando || !sesion) return;

    procesando = true;

    try {
      await escaner.stop();
      camaraActiva = false;

      const etapa = document.getElementById("etapa").value;

      mostrarEstado("Registrando " + etapa + "...");

      const resultado = await llamarAPI({
        action: "scan",
        tokenSesion: sesion,
        tokenQR: codigoQR,
        etapa: etapa
      });

      mostrarEstado(
        "✓ REGISTRO CORRECTO\n\n" +
        resultado.nombre + "\n" +
        resultado.etapa + "\n" +
        "Coordinador: " + resultado.coordinador
      );

    } catch (error) {
      mostrarEstado("⚠ " + error.message);
    } finally {
      procesando = false;
      document.getElementById("btnSiguiente")
        .classList.remove("oculto");
    }
  }

  async function cerrarSesion() {
    if (sesion) {
      try {
        await llamarAPI({
          action: "logout",
          tokenSesion: sesion
        });
      } catch (error) {
        // Se cierra igualmente la sesión local.
      }
    }

    if (escaner && camaraActiva) {
      try {
        await escaner.stop();
      } catch (error) {}
    }

    sesion = "";
    camaraActiva = false;
    procesando = false;

    document.getElementById("panel").classList.add("oculto");
    document.getElementById("login").classList.remove("oculto");
    document.getElementById("codigo").value = "";
    document.getElementById("btnCamara").classList.remove("oculto");
    document.getElementById("btnSiguiente").classList.add("oculto");

    mostrarEstado("Sesión cerrada. Podés volver a ingresar.");
  }
</script>
</body>
</html>
