<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>BREAK COORDINADORES</title>
  <meta name="theme-color" content="#171c22">
  <meta name="apple-mobile-web-app-title" content="BREAK COORD">
  <meta name="application-name" content="BREAK COORD">

  <link rel="icon" type="image/png"
        sizes="192x192" href="icon-192.png">

  <link rel="apple-touch-icon"
        href="icon-512.png">

  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 22px;
      background: #f1f3f5;
      color: #20252b;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      max-width: 440px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 16px #00000012;
    }

    h1 { text-align: center; margin: 0 0 6px; }

    .subtitulo {
      text-align: center;
      color: #68717b;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #ccd2d8;
      background: white;
    }

    button {
      border: 0;
      background: #171c22;
      color: white;
      font-weight: bold;
      margin-top: 14px;
      cursor: pointer;
    }

    button:disabled { opacity: .5; }

    .secundario {
      background: #e7eaee;
      color: #20252b;
    }

    .peligro { background: #a52b2b; color: white; }

    #lector { width: 100%; margin-top: 18px; }

    #estado {
      margin-top: 18px;
      padding: 14px;
      border-radius: 9px;
      background: #f0f2f4;
      white-space: pre-wrap;
      line-height: 1.45;
      text-align: center;
    }

    .oculto { display: none !important; }

    .nombre-coordinador {
      text-align: center;
      color: #59636e;
      margin: 12px 0;
    }

    .salida {
      margin-top: 16px;
      padding: 15px;
      background: #eef2f5;
      border-radius: 10px;
      text-align: center;
      line-height: 1.5;
    }

    .salida strong { display: block; margin-bottom: 5px; }

    .sin-salida { color: #a52b2b; font-weight: bold; }
    .con-salida { color: #176b3a; font-weight: bold; }

    .pestanas {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .pestanas button {
      margin-top: 0;
      background: #e7eaee;
      color: #20252b;
      flex: 1;
    }

    .pestanas button.activa {
      background: #171c22;
      color: white;
    }

    .contenido-pestana {
      margin-top: 16px;
    }

    .contador {
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      margin: 12px 0;
    }

    .item-pendiente {
      padding: 12px;
      margin-bottom: 9px;
      border: 1px solid #e0e4e8;
      border-radius: 9px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .item-pendiente strong { display: block; }

    .sin-pendientes {
      padding: 18px 10px;
      text-align: center;
      color: #176b3a;
      font-weight: bold;
      background: #edf7f0;
      border-radius: 9px;
    }

    .actualizacion {
      text-align: center;
      font-size: 12px;
      color: #68717b;
      margin-top: 12px;
    }

    .aviso-cierre {
      padding: 12px;
      background: #fff5e5;
      border-radius: 9px;
      line-height: 1.45;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <main class="contenedor">

    <h1>BREAK</h1>
    <div class="subtitulo">Control de excursiones</div>

    <section id="login">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" placeholder="tu correo">

      <label for="codigo">Código de acceso</label>
      <input id="codigo" type="password"
             inputmode="numeric" maxlength="6"
             placeholder="6 dígitos">

      <button id="btnLogin" onclick="iniciarSesion()">Ingresar</button>
      <button type="button" class="secundario" onclick="mostrarRegistro()">Registrarme como coordinador</button>

      <div style="border-top:1px solid #e0e4e8;margin-top:24px;padding-top:18px;">
        <h2 style="font-size:19px;text-align:center;margin:0 0 8px;">¡Genera tu QR para toda la semana!</h2>
        <p style="font-size:14px;line-height:1.45;color:#68717b;text-align:center;margin:0;">Ingresá tu DNI para consultar tus credenciales BREAK activas.</p>
        <label for="dniQR">DNI</label>
        <input id="dniQR" type="text" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Sin puntos ni espacios">
        <button id="btnObtenerQR" onclick="obtenerQRPorDNI()">OBTENER MI QR</button>
        <div id="resultadoQR" class="oculto" aria-live="polite" style="margin-top:16px;"></div>
      </div>
    </section>

    <section id="registro" class="oculto">
      <h2>Registro de coordinador</h2>
      <label for="registroNombre">Nombre</label>
      <input id="registroNombre" type="text" maxlength="60" autocomplete="given-name">
      <label for="registroApellido">Apellido</label>
      <input id="registroApellido" type="text" maxlength="60" autocomplete="family-name">
      <label for="registroEmail">Correo electrónico</label>
      <input id="registroEmail" type="email" maxlength="120" autocomplete="email">
      <label for="registroCodigo">Elegí un código personal de 6 dígitos</label>
      <input id="registroCodigo" type="password" inputmode="numeric" maxlength="6" placeholder="6 dígitos" autocomplete="new-password">
      <label for="registroCodigoConfirmar">Repetí el código</label>
      <input id="registroCodigoConfirmar" type="password" inputmode="numeric" maxlength="6" placeholder="Repetí los 6 dígitos" autocomplete="new-password">
      <button id="btnRegistro" onclick="enviarRegistro()">Enviar solicitud</button>
      <button type="button" class="secundario" onclick="mostrarLogin()">Volver al ingreso</button>
    </section>

    <section id="panel" class="oculto">

      <div id="coordinador" class="nombre-coordinador"></div>

      <div class="salida">
        <strong>ESTADO DE LA SALIDA</strong>
        <div id="estadoSalida">Consultando...</div>
        <div id="detalleSalida"></div>
      </div>

      <section id="controlesAutorizados" class="oculto">
        <button id="btnAbrir" onclick="abrirNuevaSalida()">
          Abrir nueva salida
        </button>

        <button id="btnCerrar" class="peligro oculto"
                onclick="cerrarSalidaActual()">
          Cerrar salida
        </button>
      </section>

      <div id="zonaTrabajo" class="oculto">

        <div class="pestanas">
          <button id="tabEscanear" class="activa"
                  onclick="mostrarPestana('escanear')">
            ESCANEAR
          </button>

          <button id="tabPendientes"
                  onclick="mostrarPestana('pendientes')">
            PENDIENTES
          </button>
        </div>

        <section id="pestanaEscanear" class="contenido-pestana">

          <label for="etapa">Tipo de control</label>

          <select id="etapa">
            <option value="IDA">IDA</option>
            <option value="REGRESO">REGRESO</option>
          </select>

          <div id="lector"></div>

          <button id="btnCamara" onclick="iniciarCamara()">
            Activar cámara
          </button>

          <button id="btnSiguiente" class="secundario oculto"
                  onclick="iniciarCamara()">
            Escanear siguiente pasajero
          </button>

        </section>

        <section id="pestanaPendientes" class="contenido-pestana oculto">
          <div class="contador" id="contadorPendientes">
            Consultando pendientes...
          </div>

          <div id="listaPendientes"></div>

          <div class="actualizacion" id="horaActualizacion">
            La lista se actualiza automáticamente.
          </div>

          <button class="secundario" onclick="actualizarPendientes(true)">
            Actualizar ahora
          </button>

          <div id="avisoCierre" class="aviso-cierre oculto">
            Revisá esta lista antes de cerrar la salida.
          </div>
        </section>

      </div>

      <button class="secundario" onclick="cerrarSesion()">
        Cerrar sesión
      </button>

    </section>

    <div id="estado"></div>

  </main>

<script>
  const API_URL = "https://break-qr-api.maxpietra306.workers.dev";

  let sesion = "";
  let nombreCoordinador = "";
  let puedeAbrirSalidas = false;
  let escaner = null;
  let procesando = false;
  let camaraActiva = false;
  let salidaActiva = false;
  let temporizadorPendientes = null;
  let consultandoPendientes = false;
  let idSalidaActual = "";

  function mostrarEstado(mensaje) {
    document.getElementById("estado").textContent = mensaje;
  }

  async function llamarAPI(datos) {
    const respuesta = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(datos)
    });

    const resultado = await respuesta.json();

    if (!resultado.ok) {
      throw new Error(resultado.error || "Error de conexión.");
    }

    return resultado.resultado;
  }

  function mostrarRegistro() {
    document.getElementById('login').classList.add('oculto');
    document.getElementById('registro').classList.remove('oculto');
    mostrarEstado('Completá tus datos para solicitar acceso.');
  }

  function mostrarLogin() {
    document.getElementById('registro').classList.add('oculto');
    document.getElementById('login').classList.remove('oculto');
    mostrarEstado('');
  }

  async function enviarRegistro() {
    const nombre = document.getElementById('registroNombre').value.trim();
    const apellido = document.getElementById('registroApellido').value.trim();
    const email = document.getElementById('registroEmail').value.trim();
    const codigo = document.getElementById('registroCodigo').value.trim();
    const confirmar = document.getElementById('registroCodigoConfirmar').value.trim();
    const boton = document.getElementById('btnRegistro');
    if (!nombre || !apellido || !email || !codigo || !confirmar) {
      mostrarEstado('Completá todos los campos.');
      return;
    }
    if (!/^\d{6}$/.test(codigo)) {
      mostrarEstado('El código debe tener exactamente 6 dígitos.');
      return;
    }
    if (codigo !== confirmar) {
      mostrarEstado('Los códigos no coinciden.');
      return;
    }
    boton.disabled = true;
    mostrarEstado('Enviando solicitud...');
    try {
      const resultado = await llamarAPI({
        action: 'registro_coordinador',
        nombre: nombre,
        apellido: apellido,
        email: email,
        codigo: codigo
      });
      document.getElementById('registro').classList.add('oculto');
      mostrarEstado(resultado.mensaje || 'Solicitud enviada. Esperá la aprobación del administrador.');
      document.getElementById('registroCodigo').value = '';
      document.getElementById('registroCodigoConfirmar').value = '';
    } catch (error) {
      mostrarEstado(error.message);
    } finally {
      boton.disabled = false;
    }
  }

  async function obtenerQRPorDNI() {
    const documento = document.getElementById('dniQR').value.replace(/\D/g, '');
    const boton = document.getElementById('btnObtenerQR');
    const contenedor = document.getElementById('resultadoQR');
    contenedor.classList.remove('oculto');
    contenedor.textContent = '';
    if (!/^\d{7,9}$/.test(documento)) {
      contenedor.textContent = 'Ingresá un DNI válido, sin puntos ni espacios.';
      return;
    }
    boton.disabled = true;
    contenedor.textContent = 'Buscando tus credenciales...';
    try {
      const credenciales = await llamarAPI({ action: 'obtener_qr_dni', documento: documento });
      contenedor.textContent = '';
      credenciales.forEach((credencial, indice) => {
        const tarjeta = document.createElement('div');
        tarjeta.style.cssText = 'border:1px solid #e0e4e8;border-radius:10px;padding:14px;margin-top:12px;text-align:center;';
        const titulo = document.createElement('strong');
        titulo.textContent = credencial.nombre || 'Credencial BREAK';
        const detalle = document.createElement('p');
        detalle.style.cssText = 'font-size:14px;color:#68717b;margin:7px 0;';
        detalle.textContent = 'Salida: ' + credencial.fechaSalida + (credencial.micro ? ' · Micro: ' + credencial.micro : '');
        const imagen = document.createElement('img');
        imagen.alt = 'Código QR BREAK';
        imagen.src = 'data:image/png;base64,' + credencial.qr;
        imagen.style.cssText = 'display:block;width:220px;max-width:100%;height:auto;margin:10px auto;';
        const descargar = document.createElement('a');
        descargar.href = imagen.src;
        descargar.download = 'BREAK-QR-' + (indice + 1) + '.png';
        descargar.textContent = 'Descargar QR';
        descargar.style.cssText = 'display:inline-block;padding:11px 16px;background:#171c22;color:white;text-decoration:none;border-radius:8px;font-weight:bold;';
        tarjeta.appendChild(titulo);
        tarjeta.appendChild(detalle);
        tarjeta.appendChild(imagen);
        tarjeta.appendChild(descargar);
        contenedor.appendChild(tarjeta);
      });
    } catch (error) {
      contenedor.textContent = error.message || 'No se pudo recuperar la credencial.';
    } finally {
      boton.disabled = false;
    }
  }

  async function iniciarSesion() {
    const email = document.getElementById("email").value.trim();
    const codigo = document.getElementById("codigo").value.trim();
    const boton = document.getElementById("btnLogin");

    if (!email || !/^\d{6}$/.test(codigo)) {
      mostrarEstado("Ingresá un correo y un código de 6 dígitos.");
      return;
    }

    boton.disabled = true;
    mostrarEstado("Verificando acceso...");

    try {
      const resultado = await llamarAPI({
        action: "login",
        email: email,
        codigo: codigo
      });

      sesion = resultado.token;
      nombreCoordinador = resultado.nombre;
      puedeAbrirSalidas = resultado.puedeAbrirSalidas === true;

      document.getElementById("login").classList.add("oculto");
      document.getElementById("panel").classList.remove("oculto");

      document.getElementById("coordinador").textContent =
        "Coordinador: " + nombreCoordinador;

      if (puedeAbrirSalidas) {
        document.getElementById("controlesAutorizados")
          .classList.remove("oculto");
      }

      await actualizarEstadoSalida();
      iniciarActualizacionAutomatica();

      mostrarEstado("Sesión iniciada correctamente.");

    } catch (error) {
      mostrarEstado(error.message);
    } finally {
      boton.disabled = false;
    }
  }

  async function actualizarEstadoSalida() {
    try {
      const resultado = await llamarAPI({
        action: "estado",
        tokenSesion: sesion
      });

      salidaActiva = resultado.activa;
      const texto = document.getElementById("estadoSalida");
      const detalle = document.getElementById("detalleSalida");

      if (salidaActiva) {
        idSalidaActual = resultado.salida.id;

        texto.textContent = "SALIDA ABIERTA";
        texto.className = "con-salida";

        detalle.textContent =
          "Semana " + resultado.salida.semana +
          "\nAbierta por: " + resultado.salida.abiertaPor;

        document.getElementById("zonaTrabajo").classList.remove("oculto");
        document.getElementById("btnAbrir").classList.add("oculto");

        if (puedeAbrirSalidas) {
          document.getElementById("btnCerrar").classList.remove("oculto");
        }

        await actualizarPendientes(false);

      } else {
        idSalidaActual = "";
        texto.textContent = "NO HAY SALIDA ABIERTA";
        texto.className = "sin-salida";
        detalle.textContent = "";

        document.getElementById("zonaTrabajo").classList.add("oculto");
        document.getElementById("btnCerrar").classList.add("oculto");

        document.getElementById("btnAbrir")
          .classList.toggle("oculto", !puedeAbrirSalidas);
      }

    } catch (error) {
      mostrarEstado(error.message);
    }
  }

  function mostrarPestana(nombre) {
    const escanear = nombre === "escanear";

    document.getElementById("pestanaEscanear")
      .classList.toggle("oculto", !escanear);

    document.getElementById("pestanaPendientes")
      .classList.toggle("oculto", escanear);

    document.getElementById("tabEscanear")
      .classList.toggle("activa", escanear);

    document.getElementById("tabPendientes")
      .classList.toggle("activa", !escanear);

    if (!escanear) actualizarPendientes(true);
  }

  async function actualizarPendientes(mostrarMensaje) {
    if (!sesion || consultandoPendientes) return;

    consultandoPendientes = true;

    try {
      const resultado = await llamarAPI({
        action: "pendientes",
        tokenSesion: sesion
      });

      if (!resultado.activa) {
        document.getElementById("contadorPendientes").textContent =
          "No hay una salida abierta.";
        document.getElementById("listaPendientes").innerHTML = "";
        return;
      }

      const pendientes = resultado.pendientes || [];
      const contador = document.getElementById("contadorPendientes");
      const lista = document.getElementById("listaPendientes");

      contador.textContent =
        "PENDIENTES DE REGRESO: " + pendientes.length;

      lista.innerHTML = "";

      if (pendientes.length === 0) {
        const mensaje = document.createElement("div");
        mensaje.className = "sin-pendientes";
        mensaje.textContent = "✓ TODOS LOS PASAJEROS REGISTRADOS TIENEN SU REGRESO.";
        lista.appendChild(mensaje);
      } else {
        pendientes.forEach((p, i) => {
          const item = document.createElement("div");
          item.className = "item-pendiente";

          const nombre = document.createElement("strong");
          nombre.textContent = (i + 1) + ". " + p.apellido + ", " + p.nombre;

          const telefono = document.createElement("div");
          telefono.textContent = "Teléfono: " + (p.telefono || "No informado");

          const grupo = document.createElement("div");
          grupo.textContent = "Grupo: " + p.grupo;

          item.appendChild(nombre);
          item.appendChild(telefono);
          item.appendChild(grupo);
          lista.appendChild(item);
        });
      }

      document.getElementById("horaActualizacion").textContent =
        "Última actualización: " + new Date().toLocaleTimeString();

      if (mostrarMensaje) {
        mostrarEstado("Lista de pendientes actualizada.");
      }

    } catch (error) {
      if (mostrarMensaje) mostrarEstado(error.message);
    } finally {
      consultandoPendientes = false;
    }
  }

  function iniciarActualizacionAutomatica() {
    detenerActualizacionAutomatica();

    temporizadorPendientes = setInterval(async () => {
      if (!sesion) return;

      await actualizarEstadoSalida();

      if (salidaActiva) {
        await actualizarPendientes(false);
      }
    }, 5000);
  }

  function detenerActualizacionAutomatica() {
    if (temporizadorPendientes) {
      clearInterval(temporizadorPendientes);
      temporizadorPendientes = null;
    }
  }

  async function abrirNuevaSalida() {
    if (!puedeAbrirSalidas) return;

    const boton = document.getElementById("btnAbrir");
    boton.disabled = true;

    try {
      await llamarAPI({
        action: "abrir_salida",
        tokenSesion: sesion
      });

      await actualizarEstadoSalida();
      mostrarPestana("escanear");

      mostrarEstado(
        "Nueva salida abierta correctamente para todos los coordinadores."
      );

    } catch (error) {
      mostrarEstado(error.message);
    } finally {
      boton.disabled = false;
    }
  }

  async function cerrarSalidaActual() {
    if (!puedeAbrirSalidas || !salidaActiva) return;

    mostrarPestana("pendientes");
    await actualizarPendientes(false);

    const confirmar = confirm(
      "Antes de cerrar, revisá la pestaña PENDIENTES.\n\n" +
      "¿Confirmás que querés cerrar esta salida?"
    );

    if (!confirmar) {
      mostrarEstado("Cierre cancelado. La salida continúa abierta.");
      return;
    }

    const boton = document.getElementById("btnCerrar");
    boton.disabled = true;

    try {
      const resultado = await llamarAPI({
        action: "cerrar_salida",
        tokenSesion: sesion
      });

      salidaActiva = false;

      if (escaner && camaraActiva) {
        await escaner.stop();
        camaraActiva = false;
      }

      const pendientes = resultado.pendientes || [];
      const contador = document.getElementById("contadorPendientes");
      const lista = document.getElementById("listaPendientes");

      contador.textContent =
        "PENDIENTES AL CIERRE: " + pendientes.length;

      lista.innerHTML = "";

      if (pendientes.length === 0) {
        const mensaje = document.createElement("div");
        mensaje.className = "sin-pendientes";
        mensaje.textContent = "✓ NO HAY PASAJEROS PENDIENTES DE REGRESO.";
        lista.appendChild(mensaje);
      } else {
        pendientes.forEach((p, i) => {
          const item = document.createElement("div");
          item.className = "item-pendiente";

          const nombre = document.createElement("strong");
          nombre.textContent = (i + 1) + ". " + p.apellido + ", " + p.nombre;

          const telefono = document.createElement("div");
          telefono.textContent = "Teléfono: " + (p.telefono || "No informado");

          const grupo = document.createElement("div");
          grupo.textContent = "Grupo: " + p.grupo;

          item.appendChild(nombre);
          item.appendChild(telefono);
          item.appendChild(grupo);
          lista.appendChild(item);
        });
      }

      document.getElementById("horaActualizacion").textContent =
        "Salida cerrada por " + nombreCoordinador;

      await actualizarEstadoSalida();

      document.getElementById("zonaTrabajo").classList.remove("oculto");
      document.getElementById("pestanaPendientes").classList.remove("oculto");
      document.getElementById("pestanaEscanear").classList.add("oculto");
      document.getElementById("tabPendientes").classList.add("activa");
      document.getElementById("tabEscanear").classList.remove("activa");

      document.getElementById("avisoCierre").classList.remove("oculto");

      mostrarEstado(
        "SALIDA CERRADA CORRECTAMENTE.\n" +
        "Pendientes de regreso: " + pendientes.length
      );

    } catch (error) {
      mostrarEstado(error.message);
    } finally {
      boton.disabled = false;
    }
  }

  async function iniciarCamara() {
    if (!sesion || camaraActiva || !salidaActiva) return;

    if (!window.isSecureContext ||
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      mostrarEstado("La cámara requiere una conexión HTTPS.");
      return;
    }

    procesando = false;

    document.getElementById("btnCamara").classList.add("oculto");
    document.getElementById("btnSiguiente").classList.add("oculto");

    try {
      if (!escaner) escaner = new Html5Qrcode("lector");

      mostrarEstado("Solicitando acceso a la cámara...");

      await escaner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 }
        },
        codigo => procesarQR(codigo),
        () => {}
      );

      camaraActiva = true;
      mostrarEstado("Cámara activa. Enfocá el QR del pasajero.");

    } catch (error) {
      camaraActiva = false;
      document.getElementById("btnCamara").classList.remove("oculto");

      mostrarEstado(
        "No se pudo activar la cámara.\n" + (error.message || error)
      );
    }
  }

  async function procesarQR(codigoQR) {
    if (procesando || !sesion || !salidaActiva) return;

    procesando = true;

    try {
      await escaner.stop();
      camaraActiva = false;

      const etapa = document.getElementById("etapa").value;

      mostrarEstado("Registrando " + etapa + "...");

      const resultado = await llamarAPI({
        action: "scan",
        tokenSesion: sesion,
        tokenQR: codigoQR,
        etapa: etapa
      });

      mostrarEstado(
        "✓ REGISTRO CORRECTO\n\n" +
        resultado.nombre + "\n" +
        resultado.etapa + "\n" +
        "Coordinador: " + resultado.coordinador +
        "\nSemana: " + resultado.semana
      );

      await actualizarPendientes(false);

    } catch (error) {
      mostrarEstado("⚠ " + error.message);
    } finally {
      procesando = false;

      document.getElementById("btnSiguiente")
        .classList.remove("oculto");
    }
  }

  async function cerrarSesion() {
    detenerActualizacionAutomatica();

    if (sesion) {
      try {
        await llamarAPI({
          action: "logout",
          tokenSesion: sesion
        });
      } catch (error) {}
    }

    if (escaner && camaraActiva) {
      try {
        await escaner.stop();
      } catch (error) {}
    }

    sesion = "";
    camaraActiva = false;
    procesando = false;
    salidaActiva = false;
    idSalidaActual = "";

    document.getElementById("panel").classList.add("oculto");
    document.getElementById("login").classList.remove("oculto");
    document.getElementById("codigo").value = "";

    document.getElementById("controlesAutorizados").classList.add("oculto");
    document.getElementById("zonaTrabajo").classList.add("oculto");

    document.getElementById("btnCamara").classList.remove("oculto");
    document.getElementById("btnSiguiente").classList.add("oculto");

    document.getElementById("listaPendientes").innerHTML = "";
    document.getElementById("avisoCierre").classList.add("oculto");

    mostrarEstado("Sesión cerrada. Podés volver a ingresar.");
  }
</script>
</body>
</html>
